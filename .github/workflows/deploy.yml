name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# O deploy usa OIDC (id-token) em vez de empurrar para uma branch gh-pages,
# entao nao ha commit de build no historico.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy de cada vez. cancel-in-progress: false porque cancelar um deploy
# no meio deixa o Pages num estado parcial.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
